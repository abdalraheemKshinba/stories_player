# Publishes a package to pub.dev when a tag like `stories_player-v0.1.1`
# is pushed. pub.dev must have automated publishing enabled for the package
# (Admin tab: GitHub Actions, repository abdalraheemKshinba/stories_player, tag pattern
# `<package>-v{{version}}`), and the first version must be published by hand.
name: publish

on:
  push:
    tags:
      - 'stories_player-v[0-9]+.[0-9]+.[0-9]+*'
      - 'stories_player_video-v[0-9]+.[0-9]+.[0-9]+*'
      - 'stories_player_lottie-v[0-9]+.[0-9]+.[0-9]+*'
      - 'stories_player_audio-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # pub.dev authenticates the workflow with an OIDC token
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1 # sets up pub.dev credentials from OIDC
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Find the package
        id: pkg
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - name: Publish
        working-directory: packages/${{ steps.pkg.outputs.name }}
        run: |
          rm -f pubspec_overrides.yaml
          flutter pub get
          flutter pub publish --force
